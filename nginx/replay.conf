# Serves ReplayWeb.page and proxies WACZ out of an S3-compatible store.
#
# ${S3_BUCKET_URL} is substituted by entrypoint.sh at container start, not by
# nginx — nginx has no environment-variable interpolation of its own.
# Everything else with a `$` is an nginx variable and survives.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # No Service-Worker-Allowed header here, deliberately. sw.js sits at the web
  # root, so its default scope is already "/" and the header is a no-op —
  # measured by serving without it and replaying a WACZ end to end (identical
  # result: 67 articles, 56 images). It would only be needed if sw.js moved
  # into a subdirectory.

  # What this image was baked from, and what it is serving.
  location = /__version {
    default_type application/json;
  }

  # ReplayWeb.page is AGPL-3.0-or-later. Serving it over a network is
  # distribution, so recipients get told what it is and where the source
  # lives. LICENSE-replaywebpage sits next to this.
  location = /SOURCE.txt {
    default_type text/plain;
  }

  # WACZ comes from the object store. SeaweedFS already answers with
  # `Content-Type: application/wacz+zip`, `Accept-Ranges: bytes` and a correct
  # `Content-Range` (measured), so nothing is rewritten here — wabac issues
  # ~60 range requests per archive and they pass straight through.
  #
  # The upstream goes through $upstream rather than being written into
  # proxy_pass literally. nginx resolves a FULLY literal proxy_pass while
  # loading the config and refuses to start when the name does not answer:
  #
  #   [emerg] host not found in upstream "…" in default.conf:7
  #
  # Orchestrators without healthchecks start things in whatever order they
  # like, so that would kill this container whenever it wins the race against
  # the store. Any variable in proxy_pass defers resolution to request time,
  # and $1 alone would technically be enough — $upstream is here so that the
  # deferral survives someone rewriting this location without a capture.
  # Deferred resolution is also why entrypoint.sh has to write a `resolver`.
  location ~ ^/wacz/(.*)$ {
    set $upstream "${S3_BUCKET_URL}";
    proxy_pass $upstream/$1$is_args$args;
    # Read anonymously. Anything the host sent is not our credential.
    proxy_set_header Authorization "";
  }
}
